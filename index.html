/* ============================ HELPERS ============================ */

function getBand(score) {
  return BANDS.find((b) => score >= b.min && score <= b.max) || BANDS[0];
}

function getPhaseScore(answers, phaseIdx) {
  const start = phaseIdx * 5;
  const raw = answers.slice(start, start + 5).reduce((a, b) => a + (b || 0), 0);
  return Math.round((raw / 25) * 100);
}

function getWeakestPhase(phaseScores) {
  let minIdx = 0;
  for (let i = 1; i < phaseScores.length; i++) {
    if (phaseScores[i] < phaseScores[minIdx]) minIdx = i;
  }
  return minIdx;
}

/* Build the step sequence: start → (phase-intro → 5 questions) ×5 → capture → results */
function buildSteps() {
  const steps = [{ type: "start" }];
  PHASES.forEach((_, p) => {
    steps.push({ type: "phase-intro", phase: p });
    for (let q = 0; q < 5; q++) steps.push({ type: "question", phase: p, qIndex: p * 5 + q, localQ: q });
  });
  steps.push({ type: "capture" });
  steps.push({ type: "results" });
  return steps;
}

const STEPS = buildSteps();

/* ============================ ANIMATED NUMBER ============================ */

function AnimatedNumber({ value, duration = 1300 }) {
  const [display, setDisplay] = useState(0);
  const startRef = useRef(null);
  const frameRef = useRef(null);
  useEffect(() => {
    if (frameRef.current) cancelAnimationFrame(frameRef.current);
    const start = display;
    startRef.current = null;
    const animate = (ts) => {
      if (!startRef.current) startRef.current = ts;
      const elapsed = ts - startRef.current;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setDisplay(Math.round(start + (value - start) * eased));
      if (progress < 1) frameRef.current = requestAnimationFrame(animate);
    };
    frameRef.current = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(frameRef.current);
  }, [value]);
  return <>{display}</>;
}

          font-family: 'DM Sans', sans-serif; font-size: 15px; color: #5a6a84;
          line-height: 1.6; max-width: 400px; margin: 0 auto 28px;
        }
        .cap-field { margin-bottom: 14px; text-align: left; }
        .cap-input {
          width: 100%; padding: 14px 16px; border-radius: 10px;
          border: 2px solid #e8ecf4; background: #fafbfd;
          font-family: 'DM Sans', sans-serif; font-size: 15px; color: #1A3A6C;
          transition: border-color 0.18s, background 0.18s;
        }
        .cap-input:focus { outline: none; border-color: #E8703A; background: white; }
        .cap-input::placeholder { color: #aab4c6; }
        .cap-privacy {
          font-family: 'DM Sans', sans-serif; font-size: 12px; color: #8a9ab5;
          margin-top: 16px; line-height: 1.5;
        }

        /* RESULTS */
        .res-header {
          background: #1A3A6C; padding: 26px 32px 22px; text-align: center; position: relative;
        }
        .res-header::after {
          content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
          width: 60px; height: 3px; background: #E8703A; border-radius: 99px;
        }
        .res-wordmark {
          font-family: 'Oswald', sans-serif; font-size: 11px; font-weight: 600;
          letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 4px;
        }
        .res-title { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; color: white; letter-spacing: 0.04em; text-transform: uppercase; }
        .res-name { font-family: 'DM Sans', sans-serif; font-size: 13px; color: rgba(255,255,255,0.55); margin-top: 4px; }
        .res-score-sec { padding: 32px 32px 24px; display: flex; align-items: center; gap: 26px; border-bottom: 1px solid #edf0f7; }
        .res-gauge { flex-shrink: 0; position: relative; width: 140px; height: 140px; }
        .res-gauge-inner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -48%); text-align: center; }
        .res-score-num { font-family: 'Oswald', sans-serif; font-size: 46px; font-weight: 700; color: #1A3A6C; line-height: 1; }
        .res-score-denom { font-family: 'DM Sans', sans-serif; font-size: 12px; color: #8a9ab5; font-weight: 500; margin-top: 2px; }
        .res-band-label {
          display: inline-block; padding: 4px 12px; background: rgba(232,112,58,0.12); color: #E8703A;
          border-radius: 99px; font-family: 'Oswald', sans-serif; font-size: 12px; font-weight: 600;
          letter-spacing: 0.10em; text-transform: uppercase; margin-bottom: 10px;
        }
        .res-band-headline { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; color: #1A3A6C; line-height: 1.45; margin-bottom: 10px; }
        .res-band-body { font-family: 'DM Sans', sans-serif; font-size: 13px; color: #6b7a93; line-height: 1.6; }
        .res-phases { padding: 24px 32px; border-bottom: 1px solid #edf0f7; }
        .res-sec-title { font-family: 'Oswald', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #8a9ab5; }
        .res-callout {
          margin: 0 32px 28px; background: #1A3A6C; border-radius: 14px; padding: 22px 24px; position: relative; overflow: hidden;
        }
        .res-callout::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: #E8703A; }
        .res-callout-eyebrow { font-family: 'Oswald', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.20em; text-transform: uppercase; color: rgba(255,255,255,0.45); margin-bottom: 8px; }
        .res-callout-phase { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; color: #E8703A; letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 8px; }
        .res-callout-cost { font-family: 'DM Sans', sans-serif; font-size: 14px; color: rgba(255,255,255,0.82); line-height: 1.55; font-weight: 500; }
        .res-cta-sec { padding: 24px 32px 32px; }
        .res-cta-sub { text-align: center; margin-top: 10px; font-family: 'DM Sans', sans-serif; font-size: 12px; color: #8a9ab5; }
        .res-retake {
          display: block; margin: 18px auto 0; background: none; border: none; cursor: pointer;
          font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; color: #aab4c6;
          text-decoration: underline; transition: color 0.18s;
        }
        .res-retake:hover { color: #1A3A6C; }

        .sc-footer {
          margin-top: 22px; font-family: 'Oswald', sans-serif; font-size: 10px;
          letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.3); text-align: center;
        }

        @media (max-width: 520px) {
          .res-score-sec { flex-direction: column; text-align: center; gap: 20px; }
          .start-inner, .pi-inner, .cap-inner { padding-left: 24px; padding-right: 24px; }
          .q-inner { padding-left: 22px; padding-right: 22px; }
          .res-header, .res-phases, .res-cta-sec, .res-score-sec { padding-left: 22px; padding-right: 22px; }
          .res-callout { margin-left: 22px; margin-right: 22px; }
        }
      `}</style>

      <div className="sc-root">
        {/* Top bar + progress (hidden on start & results) */}
        {step.type !== "start" && step.type !== "results" && (
          <>
            <div className="sc-topbar">
              <div className="sc-wordmark">The <span style={{color:"#fb7e2a"}}>SCALE</span> Method™</div>
              <div className="sc-progress-text">
                {step.type === "capture" ? "Almost there" : `${answeredCount} of 25`}
              </div>
            </div>
            <div className="sc-progress-track">
              <div className="sc-progress-fill" style={{ width: `${(answeredCount / 25) * 100}%` }} />
            </div>
          </>
        )}

        {/* ============ START ============ */}
        {step.type === "start" && (
          <div className="sc-card" key="start">
            <div className="start-inner">
              <div className="start-badge">Free Business Diagnostic</div>
              <h1 className="start-title">The <span style={{color:"#fb7e2a"}}>SCALE</span> <span>Growth Scorecard</span></h1>
              <p className="start-sub">
                25 questions. Five phases. One clear score that shows you exactly where your business is strong — and where it's costing you growth.
              </p>
              <div className="sc-phase-pills">
                {PHASES.map((p) => <div className="sc-phase-pill" key={p.letter}>{p.letter}</div>)}
              </div>
              <div className="start-meta-row">
                <div className="start-meta"><div className="start-meta-num">25</div><div className="start-meta-label">Questions</div></div>
                <div className="start-meta"><div className="start-meta-num">~3</div><div className="start-meta-label">Minutes</div></div>
                <div className="start-meta"><div className="start-meta-num">100</div><div className="start-meta-label">Point Score</div></div>
              </div>
              <button className="sc-btn" onClick={goNext}>Start the Assessment →</button>
            </div>
          </div>
        )}

        {/* ============ PHASE INTRO ============ */}
        {step.type === "phase-intro" && (
          <div className="sc-card" key={`pi-${step.phase}`}>
            <div className="pi-inner">
              <div className="pi-letter">{PHASES[step.phase].letter}</div>
              <div className="pi-phase-label">Phase {step.phase + 1} of 5</div>
              <div className="pi-name">{PHASES[step.phase].name}</div>
              <div className="pi-days">{PHASES[step.phase].days}</div>
              <p className="pi-intro">{PHASES[step.phase].intro}</p>
              <button className="sc-btn" onClick={goNext}>Begin {PHASES[step.phase].name} →</button>
              <button className="q-back" onClick={goBack} style={{ display: "block", margin: "18px auto 0" }}>← Back</button>
            </div>
          </div>
        )}

        {/* ============ QUESTION ============ */}
        {step.type === "question" && (
          <div className="sc-card" key={`q-${step.qIndex}`}>
            <div className="q-inner">
              <div className="q-phasetag">
                <div className="q-phasetag-letter">{PHASES[step.phase].letter}</div>
                <div className="q-phasetag-name">{PHASES[step.phase].name}</div>
              </div>
              <div className="q-number">Question {step.localQ + 1} of 5</div>
              <div className="q-text">{PHASES[step.phase].questions[step.localQ]}</div>
              <div className="q-options">
                {SCALE_OPTIONS.map((opt) => {
                  const isSelected = pending === opt.value || (pending === null && answers[step.qIndex] === opt.value);
                  return (
                    <button
                      key={opt.value}
                      className={`q-option${isSelected ? " selected" : ""}`}
                      onClick={() => selectAnswer(step.qIndex, opt.value)}
                    >
                      <div className="q-option-num">{opt.value}</div>
                      <div className="q-option-label">{opt.label}</div>
                    </button>
                  );
                })}
              </div>
              <button className="q-back" onClick={goBack}>← Back</button>
            </div>
          </div>
        )}

        {/* ============ CAPTURE ============ */}
        {step.type === "capture" && (
          <div className="sc-card" key="capture">
            <div className="cap-inner">
              <div className="cap-icon">📊</div>
              <h2 className="cap-title">Your Scale Score is ready</h2>
              <p className="cap-sub">
                Enter your details to unlock your full results — your Scale Score, your phase-by-phase breakdown, and your biggest growth drag.
              </p>
              <div className="cap-field">
                <input
                  className="cap-input"
                  type="text"
                  placeholder="First name"
                  value={form.name}
                  onChange={(e) => setForm({ ...form, name: e.target.value })}
                />
              </div>
              <div className="cap-field">
                <input
                  className="cap-input"
                  type="email"
                  placeholder="Your best email"
                  value={form.email}
                  onChange={(e) => setForm({ ...form, email: e.target.value })}
                />
              </div>
              <button
                className="sc-btn sc-btn-full"
                disabled={!emailValid || !form.name.trim() || submitting}
                onClick={handleCaptureSubmit}
              >
                {submitting ? "Unlocking your results…" : "Show My Results →"}
              </button>
              <p className="cap-privacy">
                We'll email your results and your 30-day roadmap. No spam. Unsubscribe anytime.
              </p>
            </div>
          </div>
        )}

        {/* ============ RESULTS ============ */}
        {step.type === "results" && (
          <div className="sc-card" key="results">
            <div className="res-header">
              <div className="res-wordmark">The SCALE Method™</div>
              <div className="res-title">Your Growth Scorecard</div>
              <div className="res-name">
                {form.name ? `${form.name}'s results · ` : ""}
                {new Date().toLocaleDateString("en-US", { month: "long", year: "numeric" })}
              </div>
            </div>

            <div className="res-score-sec">
              <div className="res-gauge">
                <svg width="140" height="140" viewBox="0 0 140 140">
                  <path d={arcPath(1)} fill="none" stroke="#edf0f7" strokeWidth="9" strokeLinecap="round" />
                  <path d={arcPath(overallScore / 100)} fill="none"
                    stroke={overallScore <= 40 ? "#E8703A" : overallScore <= 65 ? "#f0a060" : overallScore <= 84 ? "#2d5fa8" : "#1A3A6C"}
                    strokeWidth="9" strokeLinecap="round" />
                </svg>
                <div className="res-gauge-inner">
                  <div className="res-score-num"><AnimatedNumber value={overallScore} /></div>
                  <div className="res-score-denom">/ 100</div>
                </div>
              </div>
              <div style={{ flex: 1 }}>
                <div className="res-band-label">{band.label}</div>
                <div className="res-band-headline">{band.headline}</div>
                <div className="res-band-body">{band.body}</div>
              </div>
            </div>

            <div className="res-phases">
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "14px" }}>
                <div className="res-sec-title">Phase Breakdown</div>
                <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: "11px", color: "#8a9ab5", fontWeight: 500 }}>
                  <span style={{ color: "#E8703A", fontWeight: 700 }}>{phasesNeedingWork}</span> of 5 need work
                  <span style={{ margin: "0 6px", color: "#d0d8e8" }}>·</span>
                  <span style={{ color: "#1A3A6C", fontWeight: 700 }}>{5 - phasesNeedingWork}</span> on track
                </div>
              </div>
              {PHASES.map((phase, i) => (
                <PhaseBar key={i} phase={phase} score={phaseScores[i]} isWeakest={i === weakestIdx} needsWork={phaseScores[i] < 90} index={i} />
              ))}
              <div style={{ display: "flex", alignItems: "center", gap: "16px", marginTop: "14px", paddingTop: "12px", borderTop: "1px solid #edf0f7" }}>
                <div style={{ display: "flex", alignItems: "center", gap: "6px" }}>
                  <div style={{ width: "10px", height: "10px", borderRadius: "2px", background: "#E8703A" }} />
                  <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: "11px", color: "#8a9ab5" }}>Needs work (below 90)</span>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: "6px" }}>
                  <div style={{ width: "10px", height: "10px", borderRadius: "2px", background: "#1A3A6C" }} />
                  <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: "11px", color: "#8a9ab5" }}>On track (90+)</span>
                </div>
              </div>
            </div>

            <div className="res-callout">
              <div className="res-callout-eyebrow">Your biggest drag on growth</div>
              <div className="res-callout-phase">{PHASES[weakestIdx].letter} — {PHASES[weakestIdx].name}</div>
              <div className="res-callout-cost">{PHASES[weakestIdx].costStatement}</div>
              <div style={{ marginTop: "14px", paddingTop: "14px", borderTop: "1px solid rgba(255,255,255,0.12)", fontFamily: "'DM Sans', sans-serif", fontSize: "12px", color: "rgba(255,255,255,0.5)", lineHeight: 1.55 }}>
                The SCALE Method works all five phases in sequence — so every gap gets closed, in the right order. This phase is where you'll feel the biggest unlock.
              </div>
            </div>

            <div className="res-cta-sec">
              <button className="sc-btn sc-btn-full">{band.cta} →</button>
              <div className="res-cta-sub">{band.ctaSub}</div>
              <button className="res-retake" onClick={() => { setAnswers(Array(25).fill(null)); setForm({ name: "", email: "" }); setStepIndex(0); }}>
                Retake the assessment
              </button>
            </div>
          </div>
        )}

        <div className="sc-footer">Created by T.M. Parish · 8× Bestselling Author</div>
      </div>
    </>
  );
}


    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ScaleScorecard />);
  </script>
</body>
</html>
